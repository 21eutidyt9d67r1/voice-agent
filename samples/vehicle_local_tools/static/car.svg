<svg xmlns="http://www.w3.org/2000/svg" viewBox="85 85 885 385" role="img" aria-labelledby="title desc">
  <title id="title">AURA One electric sedan</title>
  <desc id="desc">Original illustration of a pearl silver electric sedan in front three-quarter view, with dark panoramic glass, machined alloy wheels, and illuminated LED headlights.</desc>
  <defs>
    <linearGradient id="side" x1=".1" y1="0" x2=".25" y2="1">
      <stop stop-color="#f4f8fb"/><stop offset=".18" stop-color="#d6e0e7"/>
      <stop offset=".38" stop-color="#a0b2c0"/><stop offset=".51" stop-color="#8499aa"/>
      <stop offset=".59" stop-color="#b4c5d1"/><stop offset=".78" stop-color="#8ea4b5"/>
      <stop offset=".93" stop-color="#455e73"/><stop offset="1" stop-color="#c1d0db"/>
    </linearGradient>
    <linearGradient id="bonnet" x1=".1" y1="0" x2=".7" y2="1">
      <stop stop-color="#f3f7fa"/><stop offset=".25" stop-color="#e2eaf0"/>
      <stop offset=".6" stop-color="#b3c4d1"/><stop offset="1" stop-color="#718c9f"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2=".2" y2="1">
      <stop stop-color="#c7d7e2"/><stop offset=".24" stop-color="#afc4d4"/>
      <stop offset=".5" stop-color="#688598"/><stop offset=".74" stop-color="#9fb8c9"/>
      <stop offset="1" stop-color="#3f5c70"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f4f8fb"/><stop offset=".5" stop-color="#c8d7e3"/><stop offset="1" stop-color="#6b889f"/>
    </linearGradient>
    <linearGradient id="window" x1=".2" y1="0" x2=".8" y2="1">
      <stop stop-color="#79909e"/><stop offset=".14" stop-color="#354e60"/>
      <stop offset=".48" stop-color="#172f42"/><stop offset=".75" stop-color="#0b1c2b"/>
      <stop offset="1" stop-color="#405b6f"/>
    </linearGradient>
    <linearGradient id="windshield" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67818e"/><stop offset=".3" stop-color="#253e4d"/>
      <stop offset=".65" stop-color="#152c3a"/><stop offset="1" stop-color="#526b7b"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#d4e9f5" stop-opacity=".4"/><stop offset=".4" stop-color="#c8e2f0" stop-opacity=".02"/><stop offset="1" stop-color="#72a3bc" stop-opacity=".17"/>
    </linearGradient>
    <radialGradient id="tire"><stop offset=".55" stop-color="#101820"/><stop offset=".8" stop-color="#1d2731"/><stop offset=".93" stop-color="#070c12"/><stop offset="1" stop-color="#30404d"/></radialGradient>
    <radialGradient id="alloy"><stop stop-color="#c9d8e0"/><stop offset=".45" stop-color="#768b9a"/><stop offset=".77" stop-color="#bfcbd4"/><stop offset=".89" stop-color="#e3ecf3"/><stop offset=".95" stop-color="#617786"/><stop offset="1" stop-color="#354857"/></radialGradient>
    <linearGradient id="spoke"><stop stop-color="#f5f9fc"/><stop offset=".35" stop-color="#afc4d3"/><stop offset=".56" stop-color="#e5f0f7"/><stop offset="1" stop-color="#4d6578"/></linearGradient>
    <linearGradient id="lower"><stop stop-color="#07121b"/><stop offset=".5" stop-color="#243a4a"/><stop offset="1" stop-color="#07121c"/></linearGradient>
    <filter id="floorBlur"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="lightGlow" x="-.3" y="-1" width="1.6" height="3"><feGaussianBlur stdDeviation="3"/></filter>
    <g id="wheel">
      <circle r="61" fill="url(#tire)"/>
      <circle r="55" fill="none" stroke="#4b5b67" stroke-width=".8" opacity=".6"/>
      <circle r="49" fill="url(#alloy)"/>
      <circle r="42" fill="#132431"/>
      <circle r="33" fill="#5a6d79"/>
      <circle r="30" fill="none" stroke="#8798a5" stroke-width=".8"/>
      <path d="M27-19 37-12 33 14 25 13Z" fill="#85b5b4"/>
      <g fill="url(#spoke)" stroke="#d4e2eb" stroke-width=".45">
        <path id="spokeShape" d="M-5-9-13-45-5-48 3-20 12-44 21-40 8-8 3 3Z"/>
        <use href="#spokeShape" transform="rotate(72)"/>
        <use href="#spokeShape" transform="rotate(144)"/>
        <use href="#spokeShape" transform="rotate(216)"/>
        <use href="#spokeShape" transform="rotate(288)"/>
      </g>
      <circle r="10" fill="#607989" stroke="#c4d8e5" stroke-width="1"/>
      <path d="M-4 4 0-5 4 4M-2 1H2" fill="none" stroke="#d3e7f0" stroke-width="1.2"/>
      <g fill="#d9e4eb"><circle cx="0" cy="-14" r="1.4"/><circle cx="13" cy="-4" r="1.4"/><circle cx="8" cy="11" r="1.4"/><circle cx="-8" cy="11" r="1.4"/><circle cx="-13" cy="-4" r="1.4"/></g>
    </g>
  </defs>
