  <path d="M634 367Q635 294 690 306 744 318 754 386" fill="none" stroke="#d8e5ee" stroke-width="3"/>
  <path d="M640 364Q645 308 687 313 730 319 745 375" fill="none" stroke="#4c697f" stroke-width="1.4"/>
  <g transform="translate(260 342) rotate(-5) scale(.67 .91)"><use href="#wheel"/></g>
  <g transform="translate(693 380) rotate(-8) scale(.91 1.06)"><use href="#wheel"/></g>
