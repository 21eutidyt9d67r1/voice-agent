<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Agent with image input</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Voice Agent with image input</h1>
    <div class="session">
      <span id="status" class="status">Disconnected</span>
      <button id="connect" type="button">Connect</button>
      <label><input id="mic" type="checkbox" checked> Microphone</label>
    </div>
  </header>
  <main>
    <section class="chat" aria-label="Conversation">
      <ol id="log" aria-live="polite"></ol>
      <div id="latency" class="latency"></div>
      <form id="composer">
        <div id="previews" class="previews"></div>
        <div class="row">
          <input id="text" type="text" maxlength="2000" placeholder="Ask about an image, or just chat" autocomplete="off">
          <label class="file">Add images<input id="file" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden></label>
          <button id="send" type="submit" disabled>Send</button>
        </div>
      </form>
    </section>
    <section class="camera" aria-label="Camera context">
      <div class="preview-shell">
        <video id="video" autoplay playsinline muted aria-label="Local camera preview"></video>
        <span id="live" class="badge">OFF</span>
      </div>
      <div class="row">
        <button id="camera" type="button" disabled>Start camera</button>
        <label>Retain frames <select id="retain"></select></label>
      </div>
      <p class="hint">One JPEG frame every 2 seconds (max 1280×720). Continuous video is not uploaded.
        Frames add context without starting a reply; ask a question by voice or text.</p>
      <p id="camera-status" class="hint"></p>
      <canvas id="canvas" hidden></canvas>
    </section>
  </main>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
